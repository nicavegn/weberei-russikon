<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Platzhalter: Vermietung der Flaechen">
  <defs>
    <pattern id="thv" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#20303f" stroke-width="1" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#ddd3bb"/>
  <rect width="800" height="500" fill="url(#thv)"/>
  <!-- schematischer Grundriss mit Statusfarben -->
  <g stroke="#20303f" stroke-width="2">
    <rect x="150" y="110" width="500" height="240" fill="none"/>
    <rect x="150" y="110" width="160" height="120" fill="#5c8a59" fill-opacity="0.42"/>
    <rect x="310" y="110" width="170" height="120" fill="#8d8475" fill-opacity="0.5"/>
    <rect x="480" y="110" width="170" height="120" fill="#c98a2b" fill-opacity="0.45"/>
    <rect x="150" y="230" width="240" height="120" fill="#8d8475" fill-opacity="0.5"/>
    <rect x="390" y="230" width="260" height="120" fill="#5c8a59" fill-opacity="0.42"/>
  </g>
  <text x="400" y="415" text-anchor="middle" font-family="'Playfair Display', serif" font-size="40" font-weight="700" fill="#20303f" opacity="0.7">Vermietung</text>
</svg>
